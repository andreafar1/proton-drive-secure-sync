x-common-env: &common-env
  PDSS_REMOTE: ${PDSS_REMOTE:-proton:}
  PDSS_PASSWORD: ${PDSS_PASSWORD:?Set PDSS_PASSWORD in .env}
  PDSS_SESSION_SECRET: ${PDSS_SESSION_SECRET:?Set PDSS_SESSION_SECRET in .env}
  PDSS_MAX_UPLOAD_MB: ${PDSS_MAX_UPLOAD_MB:-100}
  PDSS_HTTPS: ${PDSS_HTTPS:-0}
  PDSS_DB: /data/schedules.sqlite3
  PDSS_SYNC_ROOT: /sync
  RCLONE_CONFIG: /config/rclone.conf

x-common-volumes: &common-volumes
  - ./config/rclone.conf:/config/rclone.conf:ro
  - ${PDSS_LOCAL_DIR:-./sync}:/sync
  - pdss_data:/data

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  proton-drive-secure-sync:
    build: .
    container_name: proton-drive-secure-sync
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment: *common-env
    volumes: *common-volumes
    <<: *common-security

  scheduler:
    build: .
    container_name: proton-drive-secure-sync-scheduler
    restart: unless-stopped
    command: ["python", "scheduler.py"]
    environment: *common-env
    volumes: *common-volumes
    <<: *common-security

volumes:
  pdss_data:
